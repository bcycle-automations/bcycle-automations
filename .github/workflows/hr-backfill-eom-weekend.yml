name: HR Backfill EOM week-end
run-name: HR Backfill EOM week-end

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'What to backfill'
        required: true
        default: both
        type: choice
        options:
          - both
          - punches
          - classes
      from_date:
        description: 'Only touch records whose week ends on/after this date (YYYY-MM-DD)'
        required: true
        default: '2026-09-01'
        type: string
      dry_run:
        description: 'Report only, write nothing'
        required: true
        default: true
        type: boolean

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply the EOM week-end rule
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          TARGET: ${{ inputs.target }}
          FROM_DATE: ${{ inputs.from_date }}
          # Punches: HR base. Classes: HR - Instructors base (EOM is a synced copy).
          HR_BASE_ID: appiwfeujJzUZPPBx
          HR_PUNCHES_TABLE_ID: tblVxt2W7NanQmJFR
          HR_EOM_TABLE_ID: tbl3UMRShm59z41JL
          INSTRUCTORS_BASE_ID: appBC0Ja4B5LKbZLW
          INSTRUCTORS_CLASSES_TABLE_ID: tbl8RbWysEFdNuz37
          INSTRUCTORS_EOM_TABLE_ID: tbliX73kdfgme7r3R
          PAYROLL_TIME_ZONE: America/Toronto
        run: node scripts/hr-backfill-eom-weekend.mjs
