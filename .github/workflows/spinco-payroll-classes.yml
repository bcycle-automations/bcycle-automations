name: SPINCO PAYROLL Classes
run-name: SPINCO PAYROLL Classes

on:
  workflow_dispatch:
    inputs:
      record_id:
        description: 'Airtable "SPINCO Payroll Class log" record ID from tbl157YNKNMHiKKTq (example: recXXXX)'
        required: true
        type: string
  repository_dispatch:
    types:
      - airtable-spinco-payroll-classes

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run SPINCO PAYROLL Classes
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          MTEK_SPINCO_API_TOKEN: ${{ secrets.MTEK_SPINCO_API_TOKEN }}
          MTEK_SPINCO_BASE_URL: https://spinco.marianatek.com
          AIRTABLE_RECORD_ID: ${{ github.event.inputs.record_id || github.event.client_payload.record_id }}
          AIRTABLE_BASE_ID: appiwfeujJzUZPPBx
          AIRTABLE_RUNS_TABLE_ID: tbl157YNKNMHiKKTq
          AIRTABLE_CLASSES_TABLE_ID: tbl6TFtzRIuXkf7LN
          AIRTABLE_EMPLOYEES_TABLE_ID: tbl0FzJ2s4Mk5jWIi
          AIRTABLE_EMPLOYEES_VIEW_ID: viws8tSbvXfujLnwG
          AIRTABLE_STUDIOS_TABLE_ID: tblAXy4xm0kJMkWeQ
          AIRTABLE_CLASS_TYPES_TABLE_ID: tbliwah9oWGgIs3Gg
          AIRTABLE_PAYROLL_PERIODS_TABLE_ID: tblBobHdbWbelKS2C
          MTEK_CLASSES_PATH: /api/class_sessions
        run: node scripts/spinco-payroll-classes-workflow.mjs
