name: SPINCO MTEK locations (read-only)
run-name: SPINCO MTEK locations

on:
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: List SPINCO MTEK locations
        env:
          MTEK_SPINCO_API_TOKEN: ${{ secrets.MTEK_SPINCO_API_TOKEN }}
          MTEK_SPINCO_BASE_URL: https://spinco.marianatek.com
        run: node scripts/spinco-mtek-locations.mjs
