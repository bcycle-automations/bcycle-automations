name: Promo Tag Cleanup

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run only (plan the changes, write nothing)"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]

  schedule:
    # 7:00 UTC = 3:00 a.m. Toronto (EDT)
    - cron: "0 7 * * *"

concurrency:
  group: promo-tag-cleanup
  cancel-in-progress: false

jobs:
  promo-tag-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Remove promo tags outside Credit Package Expiry windows
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          MTEK_API_TOKEN: ${{ secrets.MTEK_API_TOKEN }}
          MTEK_SPINCO_API_TOKEN: ${{ secrets.MTEK_SPINCO_API_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || github.event.inputs.dry_run }}
        run: node scripts/promo-tag-cleanup.mjs
