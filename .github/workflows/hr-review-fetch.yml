name: HR Review Fetch
run-name: HR Review Fetch

on:
  workflow_dispatch:
    inputs:
      record_id:
        description: 'Airtable "Review Check - Week" record ID from tblicI8oQqE4GjzBa (example: recXXXX)'
        required: true
        type: string
  repository_dispatch:
    types:
      - airtable-hr-review-fetch

# One run per Review Check record at a time: a second click queues behind the first and then
# dedupes against it, instead of racing it and creating duplicates.
concurrency:
  group: hr-review-fetch-${{ github.event.inputs.record_id || github.event.client_payload.record_id }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run HR Review Fetch
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          MTEK_API_TOKEN: ${{ secrets.MTEK_API_TOKEN }}
          AIRTABLE_RECORD_ID: ${{ github.event.inputs.record_id || github.event.client_payload.record_id }}
          MTEK_BASE_URL: https://bcycle.marianatek.com
          PAYROLL_TIME_ZONE: America/Toronto
        run: node scripts/hr-review-fetch.mjs
