name: Report Low-Credit Customers

on:
  workflow_dispatch:
    inputs:
      max_remaining_credits:
        description: "Report customers with this many credits or fewer remaining"
        required: true
        default: "2"
        type: string

jobs:
  report-low-credit-customers:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run low-credit customer report
        env:
          MTEK_API_TOKEN: ${{ secrets.MTEK_API_TOKEN }}
          MAX_REMAINING_CREDITS: ${{ github.event.inputs.max_remaining_credits }}
        run: node scripts/report-low-credit-customers.mjs
