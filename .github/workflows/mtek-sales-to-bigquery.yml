name: MTEK Sales → BigQuery sync

on:
  schedule:
    - cron: "17 7 * * *" # Daily ~07:17 UTC (off top-of-hour to dodge GH Actions cron contention — not DST-adjusted)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no writes to BigQuery, no Slack message)"
        type: boolean
        default: true

jobs:
  sync-sales:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_BQ_SERVICE_ACCOUNT_KEY }}

      - name: Run sync script
        env:
          MTEK_BASE_URL: https://bcycle.marianatek.com
          MTEK_API_TOKEN: ${{ secrets.MTEK_API_TOKEN }}
          SLACK_BIGQUERY_UPDATES_WEBHOOK_URL: ${{ secrets.SLACK_BIGQUERY_UPDATES_WEBHOOK_URL }}
          META_OFFLINE_CONVERSIONS_TOKEN: ${{ secrets.META_OFFLINE_CONVERSIONS_TOKEN }}
          # Scheduled runs always write for real. Manual (workflow_dispatch)
          # runs default to a dry run unless the input is explicitly unchecked.
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || github.event.inputs.dry_run }}
        run: node scripts/mtek-sales-to-bigquery.mjs
