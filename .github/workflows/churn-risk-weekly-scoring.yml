name: Churn risk weekly scoring

on:
  schedule:
    - cron: "0 9 * * 1" # Monday 05:00 America/Toronto (fixed UTC offset — not DST-adjusted, matches existing repo convention)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no writes to BigQuery or Airtable)"
        type: boolean
        default: true
      seed_only:
        description: "Seed BigQuery only, skip Airtable entirely (for reseeding after a model change)"
        type: boolean
        default: false

jobs:
  score:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_BQ_SERVICE_ACCOUNT_KEY }}

      - name: Run daily churn-risk scoring
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          SLACK_BIGQUERY_UPDATES_WEBHOOK_URL: ${{ secrets.SLACK_BIGQUERY_UPDATES_WEBHOOK_URL }}
          # Scheduled runs always write for real. Manual (workflow_dispatch)
          # runs default to a dry run unless the input is explicitly unchecked.
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || github.event.inputs.dry_run }}
          SEED_ONLY: ${{ github.event.inputs.seed_only }}
        run: node scripts/churn-risk-weekly-scoring.mjs
