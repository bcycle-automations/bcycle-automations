name: HR Verify EOM
run-name: HR Verify EOM

on:
  workflow_dispatch:
    inputs:
      record_id:
        description: 'Airtable HR "EOM" record ID from tbl3UMRShm59z41JL (example: recXXXX)'
        required: true
        type: string
  repository_dispatch:
    types:
      - airtable-hr-verify-eom

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Resolve record id
        id: record
        shell: bash
        run: |
          RECORD_ID="${{ github.event.inputs.record_id || github.event.client_payload.record_id }}"
          if [ -z "$RECORD_ID" ]; then
            echo "record_id is required (from workflow_dispatch input or repository_dispatch client_payload.record_id)." >&2
            exit 1
          fi
          echo "record_id=$RECORD_ID" >> "$GITHUB_OUTPUT"

      - name: Verify the EOM
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_RECORD_ID: ${{ steps.record.outputs.record_id }}
          # Punches: HR base. Classes: HR - Instructors base (EOM is a synced copy).
          HR_BASE_ID: appiwfeujJzUZPPBx
          HR_PUNCHES_TABLE_ID: tblVxt2W7NanQmJFR
          HR_EOM_TABLE_ID: tbl3UMRShm59z41JL
          INSTRUCTORS_BASE_ID: appBC0Ja4B5LKbZLW
          INSTRUCTORS_CLASSES_TABLE_ID: tbl8RbWysEFdNuz37
          INSTRUCTORS_EOM_TABLE_ID: tbliX73kdfgme7r3R
          PAYROLL_TIME_ZONE: America/Toronto
        run: node scripts/hr-verify-eom.mjs
