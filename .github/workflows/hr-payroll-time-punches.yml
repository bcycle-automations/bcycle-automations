name: HR Payroll Time Punches
run-name: HR Payroll Time Punches

on:
  workflow_dispatch:
    inputs:
      record_id:
        description: 'Airtable "Budget week - Studio" record ID from tblbyFY6TlRi4BxOe (example: recXXXX)'
        required: true
        type: string
  repository_dispatch:
    types:
      - airtable-hr-payroll-time-punches

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Resolve record id
        id: record
        shell: bash
        run: |
          RECORD_ID="${{ github.event.inputs.record_id || github.event.client_payload.record_id }}"
          if [ -z "$RECORD_ID" ]; then
            echo "record_id is required (from workflow_dispatch input or repository_dispatch client_payload.record_id)." >&2
            exit 1
          fi
          echo "record_id=$RECORD_ID" >> "$GITHUB_OUTPUT"

      - name: Run HR Payroll Time Punches
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          MTEK_API_TOKEN: ${{ secrets.MTEK_API_TOKEN }}
          AIRTABLE_RECORD_ID: ${{ steps.record.outputs.record_id }}
          # HR base (NOT HR - Instructors). Editable here, no extra secrets required.
          AIRTABLE_BASE_ID: appiwfeujJzUZPPBx
          AIRTABLE_RUNS_TABLE_ID: tblbyFY6TlRi4BxOe
          AIRTABLE_PUNCHES_TABLE_ID: tblVxt2W7NanQmJFR
          AIRTABLE_EMPLOYEES_TABLE_ID: tbl0FzJ2s4Mk5jWIi
          AIRTABLE_RATES_TABLE_ID: tblufK9k5Tg5uCd74
          AIRTABLE_STUDIOS_TABLE_ID: tblAXy4xm0kJMkWeQ
          MTEK_BASE_URL: https://bcycle.marianatek.com
          MTEK_PUNCHES_PATH: /api/time_clock_shifts
          PAYROLL_TIME_ZONE: America/Toronto
        run: node scripts/hr-payroll-time-punches-workflow.mjs
