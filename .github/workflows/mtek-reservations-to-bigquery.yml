name: MTEK Reservations → BigQuery sync

on:
  schedule:
    - cron: "0 7 * * 1" # Monday 07:00 UTC (fixed — not DST-adjusted)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no writes to BigQuery, no Slack message)"
        type: boolean
        default: true
      sync_min_date:
        description: "Backfill window start, YYYY-MM-DD (optional — only used if BOTH dates are set)"
        type: string
        default: ""
      sync_max_date:
        description: "Backfill window end, YYYY-MM-DD (optional — only used if BOTH dates are set)"
        type: string
        default: ""

jobs:
  sync-reservations:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_BQ_SERVICE_ACCOUNT_KEY }}

      - name: Run sync script
        env:
          MTEK_BASE_URL: https://bcycle.marianatek.com
          MTEK_API_TOKEN: ${{ secrets.MTEK_API_TOKEN }}
          SLACK_BIGQUERY_UPDATES_WEBHOOK_URL: ${{ secrets.SLACK_BIGQUERY_UPDATES_WEBHOOK_URL }}
          # Scheduled runs always write for real. Manual (workflow_dispatch)
          # runs default to a dry run unless the input is explicitly unchecked.
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || github.event.inputs.dry_run }}
          # Optional manual window override for backfills. The script only
          # honours these when BOTH are non-empty; otherwise it resumes from
          # MAX(`Class Start Date`) in ReservationsMTEK as usual.
          SYNC_MIN_DATE: ${{ github.event.inputs.sync_min_date }}
          SYNC_MAX_DATE: ${{ github.event.inputs.sync_max_date }}
        run: node scripts/mtek-reservations-to-bigquery.mjs
