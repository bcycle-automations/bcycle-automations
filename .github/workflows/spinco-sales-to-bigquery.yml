name: SPINCO Sales → BigQuery sync

on:
  schedule:
    - cron: "23 7 * * *" # Daily ~07:23 UTC (off top-of-hour to dodge GH Actions cron contention — not DST-adjusted)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no writes to BigQuery, no Meta events, no Slack message)"
        type: boolean
        default: true
      meta_test_event_code:
        description: "Optional Meta test_event_code (Events Manager → dataset → Test events). Events show in the Test events tab only."
        type: string
        default: ""

jobs:
  sync-sales:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_BQ_SERVICE_ACCOUNT_KEY }}

      - name: Run sync script
        env:
          MTEK_SPINCO_BASE_URL: https://spinco.marianatek.com
          MTEK_SPINCO_API_TOKEN: ${{ secrets.MTEK_SPINCO_API_TOKEN }}
          SLACK_BIGQUERY_UPDATES_WEBHOOK_URL: ${{ secrets.SLACK_BIGQUERY_UPDATES_WEBHOOK_URL }}
          META_OFFLINE_CONVERSIONS_TOKEN_SPINCO: ${{ secrets.META_OFFLINE_CONVERSIONS_TOKEN_SPINCO }}
          META_TEST_EVENT_CODE: ${{ github.event.inputs.meta_test_event_code }}
          # Scheduled runs always write for real. Manual (workflow_dispatch)
          # runs default to a dry run unless the input is explicitly unchecked.
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || github.event.inputs.dry_run }}
        run: node scripts/spinco-sales-to-bigquery.mjs
