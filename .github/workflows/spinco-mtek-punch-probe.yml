name: SPINCO MTEK punch probe (read-only)
run-name: SPINCO MTEK punch probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Probe
        env:
          MTEK_SPINCO_API_TOKEN: ${{ secrets.MTEK_SPINCO_API_TOKEN }}
          MTEK_SPINCO_BASE_URL: https://spinco.marianatek.com
        run: node scripts/spinco-mtek-punch-probe.mjs
