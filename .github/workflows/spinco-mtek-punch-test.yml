name: SPINCO MTEK punch test helper
run-name: SPINCO MTEK punch test (${{ inputs.mode }})

on:
  workflow_dispatch:
    inputs:
      mode:
        description: inspect | create | delete
        required: true
        default: inspect
        type: string
      location_id:
        description: MTEK location id
        required: false
        default: '48785'
        type: string

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run
        env:
          MTEK_SPINCO_API_TOKEN: ${{ secrets.MTEK_SPINCO_API_TOKEN }}
          MTEK_SPINCO_BASE_URL: https://spinco.marianatek.com
          MODE: ${{ inputs.mode }}
          LOCATION_ID: ${{ inputs.location_id }}
        run: node scripts/spinco-mtek-punch-test.mjs
