name: HR Create Payroll period
run-name: HR Create Payroll period

on:
  schedule:
    # Sundays 08:10 UTC = 4:10am America/Toronto (EDT), 3:10am (EST). Weekly on
    # purpose: the script only creates a period on the Sunday one is due.
    - cron: '10 8 * * 0'
  workflow_dispatch:

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create Payroll period and link punches
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: appiwfeujJzUZPPBx
          AIRTABLE_PAYROLL_PERIODS_TABLE_ID: tbl9qw4kqw0BY0DyJ
          AIRTABLE_PUNCHES_TABLE_ID: tblVxt2W7NanQmJFR
          PAYROLL_TIME_ZONE: America/Toronto
        run: node scripts/hr-create-payroll-period.mjs
