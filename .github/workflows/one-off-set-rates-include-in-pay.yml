name: One-off Set Rates Include in pay
run-name: One-off Set Rates Include in pay

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report only, write nothing'
        required: true
        type: boolean
        default: true

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Seed Include in pay? - New
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          SET_VALUE: 'No'
        run: node scripts/one-off-set-rates-include-in-pay.mjs
