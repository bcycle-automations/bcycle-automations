name: BF 2026 sale monitor (Vendredi Fou packs -> Google Sheet)

# Refreshes the Sales_Raw and Customers_Raw tabs of the "BF 2026 Sale Monitor"
# Google Sheet from the MTEK API (+ BigQuery for each buyer's prior-90-day
# history). The sheet's Dashboard tab is all formulas on top of those two tabs.
# See scripts/bf-sale-monitor-import.mjs.
#
# Triggered hourly on the day before Black Friday by a Make scheduled scenario
# that sends a repository_dispatch (GitHub's own cron is not used: new
# scheduled workflows were skipped by GitHub). Safe to run any time - the two
# raw tabs are fully overwritten each run.
on:
  repository_dispatch:
    types: [bf-sale-monitor]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: fetch and classify, print a summary, do not write the sheet"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

concurrency:
  group: bf-sale-monitor
  cancel-in-progress: true

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Authenticate to GCP (BigQuery + Sheets via the same service account)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_BQ_SERVICE_ACCOUNT_KEY }}

      - name: Import sales and buyer segments
        env:
          MTEK_BASE_URL: https://bcycle.marianatek.com
          MTEK_API_TOKEN: ${{ secrets.MTEK_API_TOKEN }}
          SHEET_ID: 1QzHukVUupfa-BkzJOrdkKNipGc0Wfx2dsaaBoAajVOc
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: node scripts/bf-sale-monitor-import.mjs
